  /* ----- formulário da tarefa ----- */
  var FT = null;
  function formTarefa(id) {
    var t = id ? acharT(id) : null;
    FT = t ? { id: t.id, titulo: t.titulo, descricao: t.descricao, tags: t.tags.slice(), prazo: t.prazo, status: t.status, itens: '' }
      : { id: '', titulo: '', descricao: '', tags: S.tagF ? [S.tagF] : [], prazo: '', status: ehDesktop() ? 'A fazer' : S.col, itens: '' };
    renderFormTarefa();
    setTimeout(function () { var e = $('#ftTit'); if (e && !id) e.focus(); }, 250);
  }
  function lerFT() {
    if (!FT) return;
    var g = function (i) { var e = document.getElementById(i); return e ? e.value : null; };
    if (g('ftTit') !== null) FT.titulo = g('ftTit');
    if (g('ftDesc') !== null) FT.descricao = g('ftDesc');
    if (g('ftPrazo') !== null) FT.prazo = g('ftPrazo');
    if (g('ftItens') !== null) FT.itens = g('ftItens');
    var nt = g('ftTag'); if (nt && nt.trim()) addTagFT(nt);
  }
  function addTagFT(txt) {
    txt.split(',').forEach(function (x) {
      x = x.trim().slice(0, 40);
      if (x && !FT.tags.some(function (y) { return y.toLowerCase() === x.toLowerCase(); })) FT.tags.push(x);
    });
  }
  function renderFormTarefa() {
    var f = FT, novo = !f.id;
    var sug = todasTags().filter(function (g) { return f.tags.indexOf(g) < 0; }).slice(0, 15);
    var h = '<h2><span>' + (novo ? 'Nova tarefa' : 'Editar tarefa') + '</span><button class="icon-btn" data-acao="fechar">' + ic('x') + '</button></h2>';
    h += '<label class="campo"><span>Título</span><input id="ftTit" maxlength="150" value="' + esc(f.titulo) + '" placeholder="O que precisa ser feito?" autocomplete="off"></label>';
    h += '<label class="campo" style="margin-bottom:6px"><span>Status</span></label><div class="seg st4">' + COLS.map(function (c) { return '<button data-acao="ftStatus" data-v="' + c.id + '" class="' + (f.status === c.id ? 'ativo' : '') + '">' + c.curto + '</button>'; }).join('') + '</div>';
    h += '<div class="campo"><span>Tags</span><div class="tag-input">' + f.tags.map(function (g, i) { return tagHtml(g + ' ×', ' data-acao="ftTagDel" data-i="' + i + '" role="button"'); }).join('') +
      '<input id="ftTag" placeholder="' + (f.tags.length ? 'Mais…' : 'Ex.: Estudos, Casa') + '" maxlength="40" autocomplete="off" enterkeyhint="done"></div>' +
      (sug.length ? '<div class="ttags" style="margin-top:8px">' + sug.map(function (g) { return tagHtml('+ ' + g, ' data-acao="ftTagAdd" data-v="' + esc(g) + '" role="button"'); }).join('') + '</div>' : '') + '</div>';
    h += '<label class="campo"><span>Prazo (opcional)</span><input type="date" id="ftPrazo" value="' + esc(f.prazo) + '"></label>';
    h += '<label class="campo"><span>Descrição (opcional)</span><textarea id="ftDesc" maxlength="3000" rows="3">' + esc(f.descricao) + '</textarea></label>';
    if (novo) h += '<label class="campo"><span>Checklist (opcional, um item por linha)</span><textarea id="ftItens" rows="3" placeholder="Comprar material&#10;Ligar para o fornecedor">' + esc(f.itens) + '</textarea></label>';
    h += '<div class="acoes"><button class="btn pri" data-acao="ftSalvar" id="ftSalvar">' + ic('check') + (novo ? 'Criar tarefa' : 'Salvar alterações') + '</button></div>';
    abrirSheet(h);
  }
  function salvarFT() {
    lerFT();
    var f = FT;
    if (!f.titulo.trim()) return toast('Informe o título', true);
    var dados = { id: f.id, titulo: f.titulo.trim(), descricao: f.descricao, tags: f.tags, prazo: f.prazo, status: f.status };
    if (!f.id) {
      var itens = f.itens.split('\n').map(function (x) { return x.trim(); }).filter(String);
      dados.checklist = itens.length ? [{ nome: '', itens: itens.map(function (x) { return { t: x, ok: false }; }) }] : [];
    }
    var b = $('#ftSalvar'); b.disabled = true; b.textContent = 'Salvando…';
    mutar('tarefaSalvar', dados).then(function () {
      fecharSheet(); FT = null;
      if (!ehDesktop()) S.col = f.status;
      render();
      toast(f.id ? 'Tarefa atualizada' : 'Tarefa criada');
    }, function () { b.disabled = false; b.innerHTML = ic('check') + 'Tentar de novo'; });
  }

  /* ----- arrastar e soltar (computador) ----- */
  var arrastando = null;
  document.addEventListener('dragstart', function (e) {
    var c = e.target.closest && e.target.closest('.tcard');
    if (!c) return;
    arrastando = c.getAttribute('data-tid');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', arrastando); } catch (x) {}
    setTimeout(function () { c.classList.add('arrastando'); }, 0);
  });
  document.addEventListener('dragend', function () {
    arrastando = null;
    document.querySelectorAll('.arrastando, .coluna.over').forEach(function (x) { x.classList.remove('arrastando'); x.classList.remove('over'); });
  });
  document.addEventListener('dragover', function (e) {
    var col = arrastando && e.target.closest && e.target.closest('.coluna');
    if (!col) return;
    e.preventDefault();
    document.querySelectorAll('.coluna.over').forEach(function (x) { if (x !== col) x.classList.remove('over'); });
    col.classList.add('over');
  });
  document.addEventListener('drop', function (e) {
    var col = arrastando && e.target.closest && e.target.closest('.coluna');
    if (!col) return;
    e.preventDefault();
    var status = col.getAttribute('data-col'), id = arrastando;
    // posição: entre os cartões acima e abaixo do ponto onde soltou
    var cards = Array.prototype.filter.call(col.querySelectorAll('.tcard'), function (c) { return c.getAttribute('data-tid') !== id; });
    var idx = cards.findIndex(function (c) { var r = c.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
    var lista = cards.map(function (c) { return acharT(c.getAttribute('data-tid')); });
    var ordem;
    if (!lista.length) ordem = 0;
    else if (idx === -1) ordem = lista[lista.length - 1].ordem + 1;
    else if (idx === 0) ordem = lista[0].ordem - 1;
    else ordem = (lista[idx - 1].ordem + lista[idx].ordem) / 2;
    moverTarefa(id, status, ordem);
  });

  /* ================= HÁBITOS ================= */
  var HVIEWS = [{ id: 'hoje', nome: 'Hoje', ic: 'sun2' }, { id: 'prog', nome: 'Progresso', ic: 'bars' }, { id: 'lista', nome: 'Hábitos', ic: 'list' }];
  var DSEM = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  var DLETRA = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];
  var EMOJIS = ['✅', '💧', '💪', '🏃', '📚', '🧠', '⏰', '🧹', '🧘', '🥗', '😴', '💊', '🙏', '✍️', '💰', '🚭', '📵', '🎯', '🎸', '🐶'];
  function addDias(d, n) { var x = new Date(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10) + n); return x.getFullYear() + '-' + ('0' + (x.getMonth() + 1)).slice(-2) + '-' + ('0' + x.getDate()).slice(-2); }
  function dow(d) { return new Date(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)).getDay(); }
  var _chkRef = null, _chkSet = null;
  function chkSet() { if (_chkRef !== S.h.checkins) { _chkRef = S.h.checkins; _chkSet = {}; S.h.checkins.forEach(function (c) { _chkSet[c[0] + '|' + c[1]] = 1; }); } return _chkSet; }
  function feito(h, d) { return !!chkSet()[d + '|' + h.id]; }
  function agendado(h, d) { return h.dias.indexOf(String(dow(d))) >= 0 && d >= (h.criadoEm || '').slice(0, 10); }
  function ativos() { return S.h.habitos.filter(function (h) { return h.ativo; }).sort(function (a, b) { return a.ordem - b.ordem; }); }
  function sequencia(h) {
    var hoje = S.h.hoje, d = hoje, n = 0;
    if (agendado(h, hoje) && !feito(h, hoje)) d = addDias(hoje, -1); // hoje ainda não feito não quebra a sequência
    for (var i = 0; i < 400; i++) {
      if (d < (h.criadoEm || '').slice(0, 10)) break;
      if (agendado(h, d)) { if (feito(h, d)) n++; else break; }
      d = addDias(d, -1);
    }
    return n;
  }
  function melhorSeq(h) {
    var d = (h.criadoEm || S.h.hoje).slice(0, 10), best = 0, cur = 0;
    for (var i = 0; d <= S.h.hoje && i < 800; i++) {
      if (agendado(h, d)) { if (feito(h, d)) { cur++; best = Math.max(best, cur); } else if (d < S.h.hoje) cur = 0; }
      d = addDias(d, 1);
    }
    return best;
  }
  function taxa(lista, ini, fim) {
    var tot = 0, ok = 0, d = ini;
    for (var i = 0; d <= fim && i < 400; i++) {
      lista.forEach(function (h) {
        if (!agendado(h, d)) return;
        var f = feito(h, d);
        if (d === S.h.hoje && !f) return; // o dia de hoje só conta quando feito
        tot++; if (f) ok++;
      });
      d = addDias(d, 1);
    }
    return tot ? ok / tot : null;
  }
  function diasTxt(dias) {
    if (dias === '0123456') return 'Todo dia';
    if (dias === '12345') return 'Seg a Sex';
    if (dias === '06') return 'Fim de semana';
    return dias.split('').map(function (x) { return DSEM[+x]; }).join(', ');
  }
  function pctTxt(p) { return p === null ? '—' : Math.round(p * 100) + '%'; }

  function renderHab() {
    if (!S.hdia) S.hdia = S.h.hoje;
    var nav = HVIEWS.map(function (v) { return '<button class="' + (S.hview === v.id ? 'ativo' : '') + '" data-acao="hView" data-id="' + v.id + '">' + ic(v.ic) + '<span>' + v.nome + '</span></button>'; }).join('');
    $('#bottomNav').style.gridTemplateColumns = 'repeat(3, 1fr)';
    $('#bottomNav').innerHTML = nav;
    $('#subnav').innerHTML = nav; $('#subnav').hidden = false;
    $('#view').innerHTML = ({ hoje: vHabHoje, prog: vHabProg, lista: vHabLista }[S.hview] || vHabHoje)();
  }

  function vHabHoje() {
    var A = ativos();
    if (!S.h.habitos.length) return vazio('flame', 'Nenhum hábito ainda', 'Toque no <b style="display:inline">+</b> para criar o primeiro.');
    var dia = S.hdia, hoje = S.h.hoje;
    // faixa dos últimos 7 dias
    var h = '<div class="dias7">';
    for (var i = 6; i >= 0; i--) {
      var d = addDias(hoje, -i), ag = A.filter(function (x) { return agendado(x, d); }), ok = ag.filter(function (x) { return feito(x, d); }).length;
      var p = ag.length ? ok / ag.length : 0, c = 2 * Math.PI * 17;
      h += '<button class="dia' + (d === dia ? ' sel' : '') + (d === hoje ? ' hoje' : '') + '" data-acao="hDia" data-id="' + d + '"><small>' + (d === hoje ? 'Hoje' : DSEM[dow(d)]) + '</small>' +
        '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" class="trilho"/>' + (p ? '<circle cx="20" cy="20" r="17" class="arco' + (p === 1 ? ' cheio' : '') + '" stroke-dasharray="' + (c * p) + ' ' + c + '" transform="rotate(-90 20 20)"/>' : '') +
        '<text x="20" y="25" text-anchor="middle">' + (+d.slice(8, 10)) + '</text></svg></button>';
    }
    h += '</div>';

    var ag = A.filter(function (x) { return agendado(x, dia); }), folga = A.filter(function (x) { return !agendado(x, dia); });
    var ok = ag.filter(function (x) { return feito(x, dia); }).length, pct = ag.length ? Math.round(ok / ag.length * 100) : 0;
    var titulo = dia === hoje ? 'Hoje' : dia === addDias(hoje, -1) ? 'Ontem' : DSEM[dow(dia)] + ', ' + dataBR(dia);
    h += '<div class="saldo hab-resumo"><div class="linha"><span><b style="font-size:18px">' + titulo + '</b><br><span class="muted">' +
      (ag.length ? ok + ' de ' + ag.length + ' hábitos' : 'Nenhum hábito neste dia') + '</span></span><span class="v num" style="color:' + (pct === 100 ? 'var(--green)' : 'var(--text)') + '">' + pct + '%</span></div>' +
      '<div class="barra"><i style="width:' + pct + '%"></i></div>' +
      (ag.length && ok === ag.length ? '<div class="sub"><span>🎉 Tudo feito' + (dia === hoje ? ' hoje' : '') + '!</span></div>' : '') + '</div>';

    if (ag.length) h += '<div class="lista">' + ag.map(function (x) { return habItem(x, dia); }).join('') + '</div>';
    if (folga.length) h += '<div class="secao"><span>De folga neste dia</span></div><div class="lista">' + folga.map(function (x) {
      return '<div class="hab-item folga"><span class="hab-ic">' + esc(x.icone) + '</span><div class="corpo"><div class="desc">' + esc(x.nome) + '</div><div class="meta">' + diasTxt(x.dias) + '</div></div></div>';
    }).join('') + '</div>';
    if (!A.length) h += vazio('pause', 'Todos os hábitos estão pausados', 'Ative algum na aba Hábitos.');
    return h;
  }

  function habItem(x, dia) {
    var f = feito(x, dia), seq = sequencia(x);
    var dots = '';
    for (var i = 6; i >= 0; i--) {
      var d = addDias(S.h.hoje, -i);
      dots += '<i class="' + (!agendado(x, d) ? 'off' : feito(x, d) ? 'ok' : d === S.h.hoje ? 'hj' : '') + '" title="' + dataBR(d) + '"></i>';
    }
    return '<div class="hab-item' + (f ? ' feito' : '') + '"><span class="hab-ic">' + esc(x.icone) + '</span>' +
      '<div class="corpo"><div class="desc">' + esc(x.nome) + '</div><div class="meta">' + (seq ? '<span class="seq">🔥 ' + seq + (seq === 1 ? ' dia' : ' dias') + '</span>' : '<span>Comece hoje</span>') + '<span class="dots7">' + dots + '</span></div></div>' +
      '<button class="check" data-acao="hCheck" data-id="' + x.id + '" aria-label="' + (f ? 'Desmarcar' : 'Marcar como feito') + '">' + ic('check') + '</button></div>';
  }

  function vHabProg() {
    var A = ativos(), hoje = S.h.hoje;
    if (!A.length) return vazio('bars', 'Sem hábitos ativos', 'Crie ou ative um hábito para ver o progresso.');
    var semana = taxa(A, addDias(hoje, -6), hoje), mes = taxa(A, addDias(hoje, -29), hoje);
    var agHoje = A.filter(function (x) { return agendado(x, hoje); });
    var dia = agHoje.length ? agHoje.filter(function (x) { return feito(x, hoje); }).length / agHoje.length : null;
    var melhor = A.reduce(function (m, x) { return Math.max(m, sequencia(x)); }, 0);
    var h = '<div class="cards" style="margin-top:4px">' + card2('Hoje', pctTxt(dia)) + card2('Últimos 7 dias', pctTxt(semana)) + card2('Últimos 30 dias', pctTxt(mes)) + card2('Maior sequência ativa', '🔥 ' + melhor) + '</div>';

    // calendário de calor: 12 semanas, colunas = semanas (dom→sáb)
    var fim = addDias(hoje, 6 - dow(hoje)), ini = addDias(fim, -83);
    h += '<div class="secao"><span>Últimas 12 semanas</span></div><div class="card heat-card"><div class="heat">';
    for (var w = 0; w < 12; w++) {
      h += '<div class="hcol">';
      for (var k = 0; k < 7; k++) {
        var d = addDias(ini, w * 7 + k);
        if (d > hoje) { h += '<i class="fut"></i>'; continue; }
        var ag = A.filter(function (x) { return agendado(x, d); }), ok = ag.filter(function (x) { return feito(x, d); }).length;
        var p = ag.length ? ok / ag.length : -1;
        var nv = p < 0 ? 'off' : p === 0 ? 'n0' : p < .34 ? 'n1' : p < .67 ? 'n2' : p < 1 ? 'n3' : 'n4';
        h += '<i class="' + nv + (d === hoje ? ' hj' : '') + '" title="' + dataBR(d) + (ag.length ? ': ' + ok + '/' + ag.length : '') + '"></i>';
      }
      h += '</div>';
    }
    h += '</div><div class="heat-leg"><span>Menos</span><i class="n0"></i><i class="n1"></i><i class="n2"></i><i class="n3"></i><i class="n4"></i><span>Mais</span></div></div>';

    h += '<div class="secao"><span>Por hábito · 30 dias</span></div><div class="card">' + A.map(function (x) {
      var p = taxa([x], addDias(hoje, -29), hoje);
      return '<div class="cat-linha"><span class="nome">' + esc(x.icone) + ' ' + esc(x.nome) + '</span><span class="num"><b>' + pctTxt(p) + '</b></span>' +
        '<span class="t"><i style="width:' + Math.round((p || 0) * 100) + '%;background:var(--green)"></i></span>' +
        '<span class="pct" style="grid-column:1/-1;text-align:left">🔥 atual ' + sequencia(x) + ' · 🏆 melhor ' + melhorSeq(x) + ' · ' + diasTxt(x.dias) + '</span></div>';
    }).join('') + '</div>';
    return h;
  }
  function card2(r, v) { return '<div class="card"><div class="r">' + r + '</div><div class="v num">' + v + '</div></div>'; }

  function vHabLista() {
    var L = S.h.habitos.slice().sort(function (a, b) { return (b.ativo - a.ativo) || a.ordem - b.ordem; });
    if (!L.length) return vazio('flame', 'Nenhum hábito ainda', 'Toque no <b style="display:inline">+</b> para criar o primeiro.');
    var linha = function (x) {
      return '<div class="hab-item' + (x.ativo ? '' : ' folga') + '"><span class="hab-ic">' + esc(x.icone) + '</span>' +
        '<button class="corpo" data-acao="hEditar" data-id="' + x.id + '" style="text-align:left"><div class="desc">' + esc(x.nome) + '</div><div class="meta">' + diasTxt(x.dias) + (x.ativo ? ' · 🔥 ' + sequencia(x) : ' · pausado') + '</div></button>' +
        '<button class="sw' + (x.ativo ? ' on' : '') + '" data-acao="hAtivo" data-id="' + x.id + '" aria-label="' + (x.ativo ? 'Pausar' : 'Ativar') + '"></button></div>';
    };
    var at = L.filter(function (x) { return x.ativo; }), pa = L.filter(function (x) { return !x.ativo; });
    return (at.length ? '<div class="secao" style="margin-top:4px"><span>Ativos</span><span>' + at.length + '</span></div><div class="lista">' + at.map(linha).join('') + '</div>' : '') +
      (pa.length ? '<div class="secao"><span>Pausados</span><span>' + pa.length + '</span></div><div class="lista">' + pa.map(linha).join('') + '</div>' : '') +
      '<p class="muted" style="font-size:13px;text-align:center;margin-top:14px">Pausar mantém o histórico; o hábito some do “Hoje” até ser ativado de novo.</p>';
  }

  function checkHabito(id) {
    var x = S.h.habitos.find(function (h) { return h.id === id; }), dia = S.hdia;
    var vai = !feito(x, dia);
    if (navigator.vibrate) navigator.vibrate(vai ? 18 : 8);
    mutar('habitoCheck', { id: id, data: dia, feito: vai }, function () {
      var antes = S.h.checkins;
      S.h.checkins = vai ? antes.concat([[dia, id]]) : antes.filter(function (c) { return !(c[0] === dia && c[1] === id); });
      return function () { S.h.checkins = antes; };
    }).then(function () {}, function () {});
    if (vai) {
      var ag = ativos().filter(function (h) { return agendado(h, dia); });
      if (ag.length > 1 && ag.every(function (h) { return feito(h, dia); })) toast('🎉 Todos os hábitos ' + (dia === S.h.hoje ? 'de hoje' : 'do dia') + ' feitos!');
    }
  }

  /* ----- formulário do hábito ----- */
  var FH = null;
  function formHabito(id) {
    var x = id ? S.h.habitos.find(function (h) { return h.id === id; }) : null;
    FH = x ? { id: x.id, nome: x.nome, icone: x.icone, dias: x.dias } : { id: '', nome: '', icone: '✅', dias: '0123456' };
    renderFormHabito();
    if (!id) setTimeout(function () { var e = $('#fhNome'); if (e) e.focus(); }, 250);
  }
  function renderFormHabito() {
    var f = FH;
    var h = '<h2><span>' + (f.id ? 'Editar hábito' : 'Novo hábito') + '</span><button class="icon-btn" data-acao="fechar">' + ic('x') + '</button></h2>';
    h += '<label class="campo"><span>Nome</span><input id="fhNome" maxlength="60" value="' + esc(f.nome) + '" placeholder="Ex.: Beber 2L de água" autocomplete="off"></label>';
    h += '<div class="campo"><span>Ícone</span><div class="emojis">' + EMOJIS.map(function (e) { return '<button class="' + (f.icone === e ? 'sel' : '') + '" data-acao="fhIcone" data-v="' + e + '">' + e + '</button>'; }).join('') + '</div></div>';
    h += '<div class="campo"><span>Repete em</span><div class="dsem">' + DLETRA.map(function (l, i) { return '<button class="' + (f.dias.indexOf(String(i)) >= 0 ? 'on' : '') + '" data-acao="fhDia" data-v="' + i + '" title="' + DSEM[i] + '">' + l + '</button>'; }).join('') + '</div>' +
      '<div class="chips" style="padding-top:10px">' + [['0123456', 'Todo dia'], ['12345', 'Seg a Sex'], ['06', 'Fim de semana']].map(function (p) { return '<button class="chip' + (f.dias === p[0] ? ' ativo' : '') + '" data-acao="fhPreset" data-v="' + p[0] + '">' + p[1] + '</button>'; }).join('') + '</div></div>';
    h += '<div class="acoes"><button class="btn pri" data-acao="fhSalvar" id="fhSalvar">' + ic('check') + (f.id ? 'Salvar alterações' : 'Criar hábito') + '</button>' +
      (f.id ? '<button class="btn perigo" data-acao="fhExcluir" data-id="' + f.id + '">' + ic('trash') + 'Excluir hábito</button>' : '') + '</div>';
    abrirSheet(h);
  }
  function lerFH() { var e = $('#fhNome'); if (e && FH) FH.nome = e.value; }
  function salvarFH() {
    lerFH();
    if (!FH.nome.trim()) return toast('Informe o nome', true);
    if (!FH.dias) return toast('Escolha pelo menos um dia', true);
    var b = $('#fhSalvar'); b.disabled = true; b.textContent = 'Salvando…';
    var novo = !FH.id;
    mutar('habitoSalvar', { id: FH.id, nome: FH.nome.trim(), icone: FH.icone, dias: FH.dias }).then(function () {
      fecharSheet(); FH = null; toast(novo ? 'Hábito criado' : 'Hábito atualizado');
    }, function () { b.disabled = false; b.innerHTML = ic('check') + 'Tentar de novo'; });
  }

  /* ================= eventos ================= */
  document.addEventListener('click', function (ev) {
    var pk = ev.target.closest('[data-pin]');
    if (pk) { teclaPin(pk.getAttribute('data-pin')); return; }
    var el = ev.target.closest('[data-acao]');
    if (!el) return;
    var a = el.getAttribute('data-acao'), id = el.getAttribute('data-id');
    switch (a) {
      case 'view': S.view = id; store('cm_view', id); if (id !== 'mes' && id !== 'anal') { } render(); window.scrollTo(0, 0); break;
      case 'mes': S.mes = somarMes(S.mes, +el.getAttribute('data-n')); render(); break;
      case 'mesHoje': S.mes = S.d.mesAtual; render(); break;
      case 'irMes': S.mes = id; S.view = 'mes'; store('cm_view', 'mes'); render(); window.scrollTo(0, 0); break;
      case 'filtro': S.filtro = id; render(); break;
      case 'histFiltro': S.histFiltro = id; render(); break;
      case 'pagar': ev.stopPropagation(); alternarPago(id); break;
      case 'pagarDet': fecharSheet(); alternarPago(id); break;
      case 'det': abrirDetalhe(id); break;
      case 'fechar': fecharSheet(); break;
      case 'editar': editarForm(id); break;
      case 'excluir': confirmarExclusao(id); break;
      case 'excluirOk':
        el.disabled = true; el.textContent = 'Excluindo…';
        mutar('excluir', { id: id, escopo: el.getAttribute('data-escopo') }).then(function () { fecharSheet(); toast('Excluído'); }, function () {});
        break;
      case 'repetir':
        var l = acharL(id), lig = !l.repetir;
        mutar('repetir', { id: id, ligado: lig }, function () { l.repetir = lig; return function () { l.repetir = !lig; }; })
          .then(function () { toast(lig ? 'Vai repetir em ' + nomeMes(somarMes(l.mes, 1)) : 'Não vai mais repetir'); if (!$('#sheet').hidden) abrirDetalhe(id); }, function () {});
        abrirDetalhe(id);
        break;
      case 'verAnexo': verAnexo(id); break;
      case 'desvincular': mutar('removerAnexo', { id: id }).then(function () { toast('Comprovante desvinculado'); abrirDetalhe(id); }, function () {}); break;
      case 'tema': trocarTema(); break;
      case 'sair': bloquear(''); break;
      case 'recarregar': iniciar(); break;
      case 'modulo': trocarModulo(id); break;
      case 'modulos':
        abrirSheet('<h2><span>Painéis</span><button class="icon-btn" data-acao="fechar">' + ic('x') + '</button></h2><div class="lista">' + MODULOS.map(function (m) {
          return '<button class="item mod-item" data-acao="modulo" data-id="' + m.id + '" style="width:100%;' + (m.breve ? 'opacity:.6' : '') + '">' + ic(m.ic) + '<div class="corpo"><div class="desc">' + esc(m.nome) + '</div><div class="meta">' + (m.breve ? 'Em breve' : m.id === S.modulo ? 'Aberto agora' : 'Toque para abrir') + '</div></div>' + (m.id === S.modulo ? ic('check') : '') + '</button>';
        }).join('') + '</div>');
        break;
      // tarefas
      case 'tCol': S.col = id; store('cm_col', id); render(); window.scrollTo(0, 0); break;
      case 'tTag': S.tagF = id; render(); break;
      case 'tDet': abrirTarefa(id); break;
      case 'tAvancar': ev.stopPropagation(); var ta = acharT(id); moverTarefa(id, COLS[Math.min(3, STATUS_IDX(ta.status) + 1)].id); break;
      case 'tStatus': moverTarefa(id, el.getAttribute('data-v')); abrirTarefa(id, true); break;
      case 'tChk':
        var tc = acharT(id), g = +el.getAttribute('data-g'), ii = +el.getAttribute('data-i');
        if (navigator.vibrate) navigator.vibrate(10);
        salvarChecklist(tc, function (c) { c[g].itens[ii].ok = !c[g].itens[ii].ok; });
        break;
      case 'tChkDel':
        var td = acharT(id), g2 = +el.getAttribute('data-g'), i2 = +el.getAttribute('data-i');
        salvarChecklist(td, function (c) { c[g2].itens.splice(i2, 1); });
        break;
      case 'tChkAdd': addItem(id, +el.getAttribute('data-g')); break;
      case 'tGrupoAdd':
        var tg = acharT(id), nome = ($('#novaLista').value || '').trim();
        salvarChecklist(tg, function (c) { c.push({ nome: nome, itens: [] }); });
        setTimeout(function () { var x = document.querySelector('[data-addg="' + (tg.checklist.length - 1) + '"]'); if (x) x.focus(); }, 50);
        break;
      case 'tGrupoDel':
        var tgd = acharT(id), g3 = +el.getAttribute('data-g');
        if (tgd.checklist[g3].itens.length && !confirm('Remover a lista "' + (tgd.checklist[g3].nome || 'Lista') + '" e seus ' + tgd.checklist[g3].itens.length + ' itens?')) break;
        salvarChecklist(tgd, function (c) { c.splice(g3, 1); });
        break;
      case 'tEditar': formTarefa(id); break;
      case 'tExcluir': confirmarExcluirTarefa(id); break;
      case 'tExcluirOk':
        el.disabled = true; el.textContent = 'Excluindo…';
        mutar('tarefaExcluir', { id: id }).then(function () { fecharSheet(); toast('Tarefa excluída'); }, function () {});
        break;
      case 'ftStatus': lerFT(); FT.status = el.getAttribute('data-v'); renderFormTarefa(); break;
      case 'ftTagAdd': lerFT(); addTagFT(el.getAttribute('data-v')); renderFormTarefa(); break;
      case 'ftTagDel': lerFT(); FT.tags.splice(+el.getAttribute('data-i'), 1); renderFormTarefa(); break;
      case 'ftSalvar': salvarFT(); break;
      // hábitos
      case 'hView': S.hview = id; store('cm_hview', id); render(); window.scrollTo(0, 0); break;
      case 'hDia': S.hdia = id; render(); break;
      case 'hCheck': checkHabito(id); break;
      case 'hEditar': formHabito(id); break;
      case 'hAtivo':
        var ha = S.h.habitos.find(function (x) { return x.id === id; }), lig2 = !ha.ativo;
        mutar('habitoAtivo', { id: id, ativo: lig2 }, function () { ha.ativo = lig2; return function () { ha.ativo = !lig2; }; })
          .then(function () { toast(lig2 ? 'Hábito ativado' : 'Hábito pausado'); }, function () {});
        break;
      case 'fhIcone': lerFH(); FH.icone = el.getAttribute('data-v'); renderFormHabito(); break;
      case 'fhDia':
        lerFH(); var dv = el.getAttribute('data-v');
        FH.dias = (FH.dias.indexOf(dv) >= 0 ? FH.dias.replace(dv, '') : FH.dias + dv).split('').sort().join('');
        renderFormHabito(); break;
      case 'fhPreset': lerFH(); FH.dias = el.getAttribute('data-v'); renderFormHabito(); break;
      case 'fhSalvar': salvarFH(); break;
      case 'fhExcluir':
        var hx = S.h.habitos.find(function (x) { return x.id === id; });
        var nchk = S.h.checkins.filter(function (c) { return c[1] === id; }).length;
        abrirSheet('<h2><span>Excluir hábito?</span></h2><p class="muted" style="margin-top:-6px">' + esc(hx.icone + ' ' + hx.nome) + (nchk ? ' · ' + nchk + ' check-in(s) também serão apagados.' : '') + '</p>' +
          '<p class="muted" style="font-size:14px">Se quiser só parar por um tempo, use <b>pausar</b> — o histórico fica guardado.</p><div class="acoes">' +
          '<button class="btn perigo" data-acao="hExcluirOk" data-id="' + id + '">' + ic('trash') + 'Excluir de vez</button>' +
          '<button class="btn sec" data-acao="hEditar" data-id="' + id + '">Cancelar</button></div>');
        break;
      case 'hExcluirOk':
        el.disabled = true; el.textContent = 'Excluindo…';
        mutar('habitoExcluir', { id: id }).then(function () { fecharSheet(); toast('Hábito excluído'); }, function () {});
        break;
      // formulário
      case 'fTipo': lerForm(); FORM.tipo = el.getAttribute('data-v'); FORM.categoria = ''; renderForm(); break;
      case 'fRec': lerForm(); FORM.recorrencia = el.getAttribute('data-v'); renderForm(); break;
      case 'fRepetir': lerForm(); FORM.repetir = !FORM.repetir; renderForm(); break;
      case 'fJaPago': lerForm(); FORM.jaPago = !FORM.jaPago; renderForm(); break;
      case 'fAplicar': lerForm(); FORM.aplicarProximos = !FORM.aplicarProximos; renderForm(); break;
      case 'fStep':
        lerForm(); var k = el.getAttribute('data-k');
        FORM[k] = Math.min(120, Math.max(k === 'total' ? 2 : 1, FORM[k] + (+el.getAttribute('data-n'))));
        $('#fParc').value = FORM.parcela; $('#fTot').value = FORM.total; $('#fParcInfo').innerHTML = infoParcelas();
        break;
      case 'salvar': salvarForm(); break;
    }
  });
  function fecharSheetSeModulos() { if (!$('#sheet').hidden && $('#sheetBody h2 span') && $('#sheetBody h2 span').textContent === 'Painéis') fecharSheet(); }

  $('#fab').addEventListener('click', function () {
    if (S.modulo === 'tar') { if (S.t) formTarefa(); }
    else if (S.modulo === 'hab') { if (S.h) formHabito(); }
    else if (S.d) novoForm();
  });

  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'fValor') {
      var dig = t.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 11);
      FORM.cents = +dig || 0;
      t.value = FORM.cents ? NUM.format(FORM.cents / 100) : '';
      if ($('#fParcInfo')) $('#fParcInfo').innerHTML = infoParcelas();
    } else if (t.id === 'fParc' || t.id === 'fTot' || t.id === 'fVenc') {
      lerForm(); if ($('#fParcInfo')) $('#fParcInfo').innerHTML = infoParcelas();
    }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.hasAttribute && t.hasAttribute('data-anexar')) { anexar(t.getAttribute('data-anexar'), t.files[0]); t.value = ''; }
  });
  document.addEventListener('keydown', function (ev) {
    if (!$('#pin').hidden) {
      if (/^\d$/.test(ev.key)) teclaPin(ev.key);
      else if (ev.key === 'Backspace') teclaPin('del');
      return;
    }
    if (ev.key === 'Escape' && !$('#sheet').hidden) fecharSheet();
    if (ev.key === 'Enter' && ev.target.tagName === 'INPUT') {
      var t = ev.target;
      if (t.hasAttribute('data-addg')) { ev.preventDefault(); addItem(t.getAttribute('data-id'), +t.getAttribute('data-addg')); }
      else if (t.id === 'novaLista') { ev.preventDefault(); var b = document.querySelector('[data-acao="tGrupoAdd"]'); if (b) b.click(); }
      else if (t.id === 'ftTag') { ev.preventDefault(); lerFT(); renderFormTarefa(); setTimeout(function () { var x = $('#ftTag'); if (x) x.focus(); }, 30); }
      else if (t.id === 'ftTit') { ev.preventDefault(); salvarFT(); }
      else if (t.id === 'fhNome') { ev.preventDefault(); salvarFH(); }
    }
  });

  // Deslizar para trocar de mês (Mês e Análise).
  var tx = null, ty = null;
  $('#view').addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  $('#view').addEventListener('touchend', function (e) {
    if (tx === null || S.modulo !== 'fin' || (S.view !== 'mes' && S.view !== 'anal') || e.target.closest('.chips')) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) { S.mes = somarMes(S.mes, dx < 0 ? 1 : -1); render(); }
    tx = null;
  }, { passive: true });

  // Recarrega dados ao voltar para o app (ex.: depois de horas em segundo plano).
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && S.token && S.d && S.pend === 0 && $('#sheet').hidden) {
      var cm = CARGA_MOD[S.modulo];
      api(cm[0]).then(function (d) { if (S.pend === 0) { S[cm[1]] = d; render(); } }, function () {});
    }
  });

  /* ================= boot ================= */
  montarTeclado();
  if (!NO_GAS) {
    // Link de instalação: .../#api=<ID da implantação>. Guarda no aparelho e limpa da barra.
    var m = /[#&]api=([\w-]{20,})/.exec(location.hash);
    if (m) { store('cm_api', m[1]); history.replaceState(null, '', location.pathname + location.search); }
    if (!store('cm_api')) {
      $('#pin').hidden = false; pinBloqueado = true;
      $('#pinMsg').textContent = 'App não configurado neste aparelho. Abra o link de instalação.';
      return;
    }
  }
  if (S.token) iniciar(); else { $('#pin').hidden = false; }
})();
</script>

<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
