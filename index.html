<!DOCTYPE html>
<html lang="pt-BR">
<head>
  
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Central Marques</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Marques">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2563eb">
  <script>
    // Aplica o tema salvo antes de pintar a tela (evita piscar).
    try { var t = localStorage.getItem('cm_tema'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <style>
:root {
  --bg: #f4f5f7; --surface: #ffffff; --surface-2: #eef0f3; --text: #111827; --muted: #6b7280;
  --border: #e3e6eb; --accent: #2563eb; --accent-soft: #e0e9fd; --on-accent: #ffffff;
  --green: #15803d; --green-soft: #dcf3e3; --red: #c2410c; --red-soft: #fde5d8;
  --amber: #b45309; --amber-soft: #fdf0d5; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 16px rgba(16,24,40,.06);
  --radius: 16px; --nav-h: 68px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1118; --surface: #141b25; --surface-2: #1c2531; --text: #e8ebf0; --muted: #98a2b3;
    --border: #273141; --accent: #6ea0ff; --accent-soft: #1d2b46; --on-accent: #0c1118;
    --green: #4ade80; --green-soft: #15301f; --red: #fb923c; --red-soft: #3a2216;
    --amber: #fbbf24; --amber-soft: #3a2e12; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1118; --surface: #141b25; --surface-2: #1c2531; --text: #e8ebf0; --muted: #98a2b3;
  --border: #273141; --accent: #6ea0ff; --accent-soft: #1d2b46; --on-accent: #0c1118;
  --green: #4ade80; --green-soft: #15301f; --red: #fb923c; --red-soft: #3a2216;
  --amber: #fbbf24; --amber-soft: #3a2e12; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.25);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased; overscroll-behavior-y: none;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* ---------- PIN ---------- */
#pin { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 16px; gap: 28px; }
.pin-brand { text-align: center; }
.pin-brand .logo { width: 64px; height: 64px; border-radius: 20px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; margin: 0 auto 14px; font-weight: 800; font-size: 26px; }
.pin-brand h1 { margin: 0; font-size: 22px; }
.pin-brand p { margin: 4px 0 0; color: var(--muted); }
.dots { display: flex; gap: 16px; height: 20px; }
.dots span { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--muted); transition: .15s; }
.dots span.on { background: var(--accent); border-color: var(--accent); transform: scale(1.1); }
.dots.erro { animation: tremer .35s; }
.dots.erro span { border-color: var(--red); }
@keyframes tremer { 25% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 75% { transform: translateX(-4px); } }
.pin-msg { min-height: 22px; color: var(--red); font-size: 15px; text-align: center; }
.teclado { display: grid; grid-template-columns: repeat(3, 76px); gap: 16px; }
.teclado button { height: 76px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); font-size: 28px; font-weight: 500; display: grid; place-items: center; transition: transform .08s, background .15s; }
.teclado button:active { transform: scale(.93); background: var(--surface-2); }
.teclado button.vazio { visibility: hidden; }
.teclado button.apagar { background: transparent; box-shadow: none; }

/* ---------- layout ---------- */
#app { min-height: 100%; }
.side { display: none; }
.top {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 8px;
  padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.top .titulo { flex: 1; font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 10px; }
.mini-logo { width: 32px; height: 32px; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-weight: 800; font-size: 15px; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:active { background: var(--surface-2); }
main { padding: 0 16px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom)); max-width: 980px; margin: 0 auto; }
.subnav { display: none; }

.bottom {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr);
  height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
  background: var(--surface); border-top: 1px solid var(--border);
}
.bottom button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 500; position: relative; }
.bottom button.ativo { color: var(--accent); }
.bottom button.ativo::before { content: ""; position: absolute; top: 0; width: 32px; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); }
.bottom .badge, .subnav .badge { position: absolute; top: 8px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }

.fab {
  position: fixed; right: 16px; bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom)); z-index: 31;
  width: 64px; height: 64px; border-radius: 20px; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; box-shadow: 0 8px 24px color-mix(in srgb, var(--accent) 40%, transparent);
  transition: transform .1s;
}
.fab:active { transform: scale(.92); }
.fab svg { width: 30px; height: 30px; stroke-width: 2.4; }

@media (min-width: 900px) {
  #app { display: grid; grid-template-columns: 248px 1fr; }
  .side { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 0; height: 100vh; padding: 20px 14px; border-right: 1px solid var(--border); background: var(--surface); }
  .side .marca { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; padding: 4px 8px 20px; }
  .side .rotulo { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px 10px 6px; }
  .side .mod { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; color: var(--muted); font-weight: 500; text-align: left; white-space: nowrap; }
  .side .mod.ativo { background: var(--accent-soft); color: var(--accent); }
  .side .mod .breve { margin-left: auto; font-size: 11px; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); }
  .side .fim { margin-top: auto; display: flex; gap: 6px; }
  .top, .bottom { display: none; }
  main { padding: 24px 32px 120px; width: 100%; }
  .subnav { display: flex; gap: 6px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  .subnav button { position: relative; display: flex; align-items: center; gap: 8px; padding: 12px 14px; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .subnav button.ativo { color: var(--accent); border-color: var(--accent); }
  .subnav .badge { position: static; }
  .fab { bottom: 32px; right: 32px; }
}

/* ---------- componentes ---------- */
.mes-nav { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 14px; }
.mes-nav .mes { font-size: 20px; font-weight: 700; text-transform: capitalize; text-align: center; }
.mes-nav .mes small { display: block; font-size: 12px; font-weight: 500; color: var(--accent); text-transform: none; min-height: 16px; }
.mes-nav button { width: 48px; height: 48px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; }

.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.card { background: var(--surface); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); }
.card .r { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.card .v { font-size: 20px; font-weight: 700; margin-top: 4px; letter-spacing: -.01em; }
.card .v.pos { color: var(--green); } .card .v.neg { color: var(--red); }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.saldo { background: var(--surface); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-bottom: 18px; }
.saldo .linha { display: flex; justify-content: space-between; align-items: baseline; }
.saldo .v { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
.barra { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 12px; }
.barra i { display: block; height: 100%; background: var(--green); border-radius: 99px; transition: width .4s; }
.saldo .sub { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 8px; }
@media (min-width: 640px) { .cards { grid-template-columns: repeat(4, 1fr); } }

.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 10px 16px; border-radius: 99px; background: var(--surface); border: 1px solid var(--border); font-size: 15px; font-weight: 500; color: var(--muted); }
.chip.ativo { background: var(--text); color: var(--bg); border-color: var(--text); }

.secao { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 4px 8px; display: flex; justify-content: space-between; }
.lista { display: flex; flex-direction: column; gap: 8px; }
.item {
  display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: var(--radius);
  padding: 12px 12px 12px 14px; box-shadow: var(--shadow); position: relative; overflow: hidden;
}
.item::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--red); }
.item.receita::before { background: var(--green); }
.item .corpo { flex: 1; min-width: 0; text-align: left; }
.item .desc { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin-top: 2px; }
.tag { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.tag svg { width: 12px; height: 12px; }
.tag.atraso { background: var(--red-soft); color: var(--red); }
.tag.hoje { background: var(--amber-soft); color: var(--amber); }
.item .valor { font-weight: 700; text-align: right; white-space: nowrap; }
.item .valor.receita { color: var(--green); }
.item.pago .desc, .item.pago .valor { opacity: .55; }
.item.pago .desc { text-decoration: line-through; text-decoration-color: var(--muted); }
.check {
  width: 52px; height: 52px; border-radius: 16px; border: 2px solid var(--border); display: grid; place-items: center;
  color: transparent; flex: none; transition: background .15s, border-color .15s, transform .1s;
}
.check:active { transform: scale(.9); }
.check svg { width: 26px; height: 26px; stroke-width: 3; }
.item.pago .check { background: var(--green); border-color: var(--green); color: var(--on-accent); }
.item.receita.pago .check { background: var(--green); }

.vazio-box { text-align: center; padding: 40px 20px; color: var(--muted); background: var(--surface); border-radius: var(--radius); border: 1px dashed var(--border); }
.vazio-box svg { width: 36px; height: 36px; margin-bottom: 8px; }
.vazio-box b { display: block; color: var(--text); margin-bottom: 4px; }

/* previsão / análise */
.mes-linha { background: var(--surface); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.mes-linha .cab { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; text-transform: capitalize; }
.mes-linha .cab .s.pos { color: var(--green); } .mes-linha .cab .s.neg { color: var(--red); }
.barras2 { display: grid; gap: 6px; margin: 10px 0 6px; }
.b2 { display: grid; grid-template-columns: 74px 1fr 104px; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.b2 .t { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.b2 .t i { display: block; height: 100%; border-radius: 99px; }
.b2 .n { text-align: right; color: var(--text); font-weight: 600; }
.mes-linha .rodape { font-size: 13px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }

.cat-linha { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.cat-linha:last-child { border-bottom: 0; }
.cat-linha .nome { font-weight: 600; }
.cat-linha .pct { color: var(--muted); font-size: 13px; text-align: right; }
.cat-linha .t { grid-column: 1 / -1; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.cat-linha .t i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.parc { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.parc:last-child { border-bottom: 0; }
.parc .anel { width: 46px; height: 46px; flex: none; }
.parc .anel circle { fill: none; stroke-width: 5; }
.parc .corpo { flex: 1; min-width: 0; }
.parc .desc { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.hist { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid var(--border); }
.hist:last-child { border-bottom: 0; }
.hist .ic { width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--surface-2); color: var(--muted); }
.hist .ic svg { width: 18px; height: 18px; }
.hist .ic.pago { background: var(--green-soft); color: var(--green); }
.hist .ic.pend { background: var(--amber-soft); color: var(--amber); }
.hist .ic.exc { background: var(--red-soft); color: var(--red); }
.hist .corpo { flex: 1; min-width: 0; }
.hist .t1 { font-weight: 600; }
.hist .t2 { font-size: 13px; color: var(--muted); }

/* ---------- folha (bottom sheet) ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet-fundo { position: absolute; inset: 0; background: rgba(0,0,0,.45); animation: fade .2s; }
.sheet {
  position: relative; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--surface);
  border-radius: 24px 24px 0 0; padding: 8px 20px calc(24px + env(safe-area-inset-bottom)); animation: subir .25s cubic-bezier(.2,.8,.2,1);
}
.sheet .alca { width: 40px; height: 5px; border-radius: 3px; background: var(--border); margin: 4px auto 14px; }
.sheet h2 { margin: 0 0 16px; font-size: 20px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
@media (min-width: 640px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 24px; padding-bottom: 24px; } .sheet .alca { display: none; } }
@keyframes subir { from { transform: translateY(40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; background: var(--surface-2); padding: 5px; border-radius: 14px; margin-bottom: 14px; }
.seg button { padding: 12px 6px; border-radius: 10px; font-weight: 600; color: var(--muted); font-size: 15px; }
.seg button.ativo { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.seg.tipo button.ativo[data-v="Despesa"] { color: var(--red); }
.seg.tipo button.ativo[data-v="Receita"] { color: var(--green); }

.campo { display: block; margin-bottom: 14px; }
.campo > span { display: block; font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.campo input, .campo select, .campo textarea {
  width: 100%; min-height: 52px; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--border);
  background: var(--bg); font-size: 17px; outline: none; transition: border-color .15s;
}
.campo textarea { min-height: 72px; resize: vertical; }
.campo input:focus, .campo select:focus, .campo textarea:focus { border-color: var(--accent); }
.campo input.valor-in { font-size: 28px; font-weight: 700; text-align: center; min-height: 64px; }
.duas { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.stepper { display: flex; align-items: center; border: 1.5px solid var(--border); border-radius: 14px; background: var(--bg); overflow: hidden; }
.stepper button { width: 52px; height: 52px; font-size: 24px; font-weight: 600; color: var(--accent); }
.stepper input { flex: 1; min-width: 0; text-align: center; border: 0 !important; background: transparent !important; font-weight: 700; padding: 0 !important; }

.toggle-linha { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px; border-radius: 14px; background: var(--surface-2); margin-bottom: 14px; }
.toggle-linha b { display: block; }
.toggle-linha small { color: var(--muted); }
.sw { width: 56px; height: 34px; border-radius: 99px; background: var(--border); position: relative; flex: none; transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
.sw.on { background: var(--green); }
.sw.on::after { transform: translateX(22px); }

.btn { width: 100%; min-height: 56px; border-radius: 16px; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn.pri { background: var(--accent); color: var(--on-accent); }
.btn.sec { background: var(--surface-2); }
.btn.ok { background: var(--green); color: var(--on-accent); }
.btn.perigo { background: var(--red-soft); color: var(--red); }
.btn:disabled { opacity: .6; }
.acoes { display: grid; gap: 10px; margin-top: 6px; }
.acoes.g2 { grid-template-columns: 1fr 1fr; }

.det-topo { text-align: center; margin-bottom: 16px; }
.det-topo .v { font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
.det-topo .s { display: inline-flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
.det-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.det-grid div { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.det-grid small { display: block; color: var(--muted); font-size: 12px; }
.det-grid b { font-weight: 600; }
.anexo-box { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; border: 1.5px dashed var(--border); margin-bottom: 14px; }
.anexo-box .corpo { flex: 1; min-width: 0; font-size: 14px; }
.anexo-box .corpo b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.anexo-img { width: 100%; border-radius: 14px; margin-bottom: 12px; display: block; }

/* ---------- tarefas (kanban) ---------- */
.badge.neutro { background: var(--surface-2); color: var(--muted); }
.bottom button.ativo .badge.neutro { background: var(--accent); color: var(--on-accent); }
.ttag { --h: 210; display: inline-flex; align-items: center; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px;
  background: hsl(var(--h) 75% 93%); color: hsl(var(--h) 55% 30%); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ttag { background: hsl(var(--h) 35% 22%); color: hsl(var(--h) 75% 80%); } }
:root[data-theme="dark"] .ttag { background: hsl(var(--h) 35% 22%); color: hsl(var(--h) 75% 80%); }
[role="button"].ttag { cursor: pointer; padding: 5px 11px; font-size: 13px; }
.ttags { display: flex; flex-wrap: wrap; gap: 5px; }

.board { display: block; }
.coluna { display: none; }
.coluna.atual { display: block; }
.ccab { display: none; }
.ccards { display: flex; flex-direction: column; gap: 8px; }
.cvazia { text-align: center; color: var(--muted); padding: 36px 16px; border: 1.5px dashed var(--border); border-radius: var(--radius); font-size: 14px; }

    var lista = L.filter(function (l) {
      return S.filtro === 'todos' || (S.filtro === 'pend' && l.status === 'Pendente') || (S.filtro === 'pago' && l.status === 'Pago') ||

    if (!L.length) return h + vazio('inbox', 'Nada lançado em ' + nomeMes(S.mes), 'Toque no <b style="display:inline">+</b> para lançar receitas e despesas.');

    if (abertos.length) h += '<div class="secao"><span>Em aberto</span><span class="num">' + abertos.length + '</span></div><div class="lista">' + abertos.map(function (l) { return itemHtml(l); }).join('') + '</div>';

  function card(r, v, cor) { return '<div class="card"><div class="r"><span class="dot" style="background:' + cor + '"></span>' + r + '</div><div class="v num">' + brl(v) + '</div></div>'; }

  /* ----- Pendentes ----- */
  function vPend() {
    var hoje = S.d.hoje, atual = S.d.mesAtual, prox = somarMes(atual, 1);
    var P0 = lancs().filter(function (l) { return l.status === 'Pendente'; }).sort(ordenar);
    var venc = P0.filter(function (l) { return l.vencimento < hoje; });
    var este = P0.filter(function (l) { return l.vencimento >= hoje && l.mes <= atual; });
    var seg = P0.filter(function (l) { return l.mes === prox; });
    var depois = P0.filter(function (l) { return l.mes > prox; });
    var dsum = function (x) { return soma(x.filter(function (l) { return l.tipo === 'Despesa'; })); };

    var h = '<div class="cards" style="margin-top:4px">' + card('Vencido', dsum(venc), 'var(--red)') + card('A pagar este mês', dsum(este), 'var(--amber)') +
      card('Próximo mês', dsum(seg), 'var(--accent)') + card('A receber', soma(P0.filter(function (l) { return l.tipo === 'Receita' && l.mes <= atual; })), 'var(--green)') + '</div>';
    if (!venc.length && !este.length && !seg.length) h += vazio('check', 'Tudo em dia!', 'Nenhuma conta pendente até o próximo mês.');

    h += bloco('Vencidos', venc) + bloco('Até o fim de ' + MESES[+atual.slice(5, 7) - 1], este) + bloco('Em ' + nomeMes(prox), seg);
    if (depois.length) h += '<div class="secao"><span>Mais adiante</span></div><button class="item" data-acao="view" data-id="prev" style="width:100%"><div class="corpo"><div class="desc">' + depois.length + ' lançamento(s) programado(s)</div><div class="meta">Total ' + brl(dsum(depois)) + ' em despesas · ver na Previsão</div></div>' + ic('right') + '</button>';

  }

  /* ----- Previsão ----- */
  function vPrev() {
    var atual = S.d.mesAtual, meses = [], max = 1;

      var pend = soma(L.filter(function (l) { return l.tipo === 'Despesa' && l.status === 'Pendente'; }));
      var fim = L.filter(function (l) { return l.recorrencia === 'Parcelado' && l.parcela === l.totalParcelas; });

    }
    var h = '<div class="secao" style="margin-top:4px"><span>Próximos 6 meses</span></div><div class="lista">';
    meses.forEach(function (x) {
      var s = x.r - x.d;
      h += '<button class="mes-linha" data-acao="irMes" data-id="' + x.m + '" style="text-align:left;width:100%">' +
        '<div class="cab"><span>' + nomeMes(x.m) + (x.m === atual ? ' <span class="tag">atual</span>' : '') + '</span><span class="s num ' + (s >= 0 ? 'pos' : 'neg') + '">' + brl(s) + '</span></div>' +
        '<div class="barras2"><div class="b2"><span>Receitas</span><span class="t"><i style="width:' + (x.r / max * 100) + '%;background:var(--green)"></i></span><span class="n num">' + brl(x.r) + '</span></div>' +

        '<div class="rodape"><span>' + x.n + ' lançamento(s)</span>' + (x.pend ? '<span>A pagar ' + brl(x.pend) + '</span>' : '') +

    });

  }

  /* ----- Análise ----- */
  function vAnal() {
    var L = lancs().filter(function (l) { return l.mes === S.mes && l.tipo === 'Despesa'; });
    var tot = soma(L);
    var ant = soma(lancs().filter(function (l) { return l.mes === somarMes(S.mes, -1) && l.tipo === 'Despesa'; }));
    var h = mesNav();

    var comp = '';
    if (ant && tot) {
      var dif = (tot - ant) / ant * 100;
      comp = '<span class="tag" style="background:' + (dif > 0 ? 'var(--red-soft);color:var(--red)' : 'var(--green-soft);color:var(--green)') + '">' + ic(dif > 0 ? 'up' : 'down') + Math.abs(dif).toFixed(0) + '% vs mês anterior</span>';
    }
    h += '<div class="saldo"><div class="linha"><span class="muted">Total de despesas</span><span class="v num">' + brl(tot) + '</span></div><div style="margin-top:8px">' + comp + '</div></div>';

    var cats = {};
    L.forEach(function (l) { cats[l.categoria] = (cats[l.categoria] || 0) + l.valor; });
    var ord = Object.keys(cats).sort(function (a, b) { return cats[b] - cats[a]; });
    h += '<div class="secao"><span>Onde foi o dinheiro</span></div><div class="card">';
    h += ord.length ? ord.map(function (c) {
      var p = cats[c] / tot * 100;
      return '<div class="cat-linha"><span class="nome">' + esc(c) + '</span><span class="num"><b>' + brl(cats[c]) + '</b> <span class="pct">' + p.toFixed(0) + '%</span></span><span class="t"><i style="width:' + p + '%"></i></span></div>';
    }).join('') : '<p class="muted" style="margin:6px 0">Sem despesas neste mês.</p>';
    h += '</div>';

    var top = L.slice().sort(function (a, b) { return b.valor - a.valor; }).slice(0, 5);
    if (top.length) h += '<div class="secao"><span>Maiores gastos</span></div><div class="lista">' + top.map(function (l) { return itemHtml(l); }).join('') + '</div>';

    // Por pessoa (sempre todas as pessoas, no mês escolhido)
    if (pessoas().length > 1) {
      var doMes = S.d.lancamentos.filter(function (l) { return l.mes === S.mes; }), pp = {};
      doMes.forEach(function (l) { var t = l.titular || padraoPessoa(); pp[t] = pp[t] || { r: 0, d: 0, pend: 0 }; if (l.tipo === 'Receita') pp[t].r += l.valor; else { pp[t].d += l.valor; if (l.status === 'Pendente') pp[t].pend += l.valor; } });
      var nomes = Object.keys(pp).sort(function (a, b) { return (b === padraoPessoa()) - (a === padraoPessoa()) || pp[b].d - pp[a].d; });
      if (nomes.length) {
        h += '<div class="secao"><span>Por pessoa · ' + nomes.length + '</span></div><div class="card" style="padding:4px 14px">' + nomes.map(function (t) {
          var x = pp[t], s = x.r - x.d;
          return '<button class="pessoa-linha" data-acao="pessoa" data-id="' + esc(t) + '"><span class="hab-ic" style="width:36px;height:36px;font-size:15px;font-weight:700">' + esc(t.charAt(0).toUpperCase()) + '</span>' +
            '<span class="corpo"><b>' + esc(t) + '</b><small class="muted">Receitas ' + brl(x.r) + ' · Despesas ' + brl(x.d) + (x.pend ? ' · a pagar ' + brl(x.pend) : '') + '</small></span>' +
            '<b class="num" style="color:' + (s >= 0 ? 'var(--green)' : 'var(--red)') + '">' + brl(s) + '</b></button>';
        }).join('') + '</div>';
      }
    }

    // Parcelamentos ativos (global)
    var grupos = {};
    lancs().forEach(function (l) { if (l.recorrencia === 'Parcelado' && l.grupo) (grupos[l.grupo] = grupos[l.grupo] || []).push(l); });
    var ativos = Object.keys(grupos).map(function (g) {
      var x = grupos[g].sort(function (a, b) { return a.parcela - b.parcela; });
      var ult = x[x.length - 1];
      var rest = x.filter(function (l) { return l.status === 'Pendente'; });
      return { desc: ult.descricao, valor: ult.valor, total: ult.totalParcelas, fimMes: ult.mes, pagas: ult.totalParcelas - rest.length, rest: rest.length, restV: soma(rest), cat: ult.categoria };
    }).filter(function (a) { return a.rest > 0; }).sort(function (a, b) { return a.fimMes < b.fimMes ? -1 : 1; });
    h += '<div class="secao"><span>Parcelamentos em andamento</span><span class="num">' + ativos.length + '</span></div><div class="card">';
    h += ativos.length ? ativos.map(function (a) {
      var p = a.pagas / a.total, c = 2 * Math.PI * 18;
      return '<div class="parc"><svg class="anel" viewBox="0 0 46 46"><circle cx="23" cy="23" r="18" style="stroke:var(--surface-2)"/><circle cx="23" cy="23" r="18" style="stroke:var(--accent)" stroke-dasharray="' + (c * p) + ' ' + c + '" transform="rotate(-90 23 23)" stroke-linecap="round"/><text x="23" y="27" text-anchor="middle" style="font-size:11px;font-weight:700;fill:var(--text)">' + a.pagas + '/' + a.total + '</text></svg>' +
        '<div class="corpo"><div class="desc">' + esc(a.desc) + '</div><div class="meta muted" style="font-size:13px">' + brl(a.valor) + '/mês · termina em <b style="color:var(--text)">' + mesCurto(a.fimMes) + '</b></div></div>' +
        '<div class="num" style="text-align:right;font-size:13px"><span class="muted">falta</span><br><b>' + brl(a.restV) + '</b></div></div>';
    }).join('') : '<p class="muted" style="margin:6px 0">Nenhum parcelamento em aberto.</p>';
    return h + '</div>';
  }

  /* ================= ações ================= */
  function acharL(id) { return S.d.lancamentos.find(function (l) { return l.id === id; }); }

  /* ----- formulário ----- */

    h += '<label class="campo"><span>Descrição</span><input id="fDesc" list="fSug" maxlength="120" autocomplete="off" value="' + esc(f.descricao) + '" placeholder="' + (f.tipo === 'Receita' ? 'Ex.: Salário' : 'Ex.: Aluguel, Internet, Celular') + '"><datalist id="fSug">' + Object.keys(sugest).slice(0, 50).map(function (s) { return '<option value="' + esc(s) + '">'; }).join('') + '</datalist></label>';
    h += '<div class="duas"><label class="campo"><span>Vencimento</span><input type="date" id="fVenc" value="' + f.vencimento + '"></label>' +

    h += campoPessoa(f);

    if (novo) {
      h += '<label class="campo" style="margin-bottom:6px"><span>Como se repete?</span></label><div class="seg">' + [['Unico', 'Único'], ['Fixo', 'Fixo mensal'], ['Parcelado', 'Parcelado']].map(function (r) {
        return '<button data-acao="fRec" data-v="' + r[0] + '" class="' + (f.recorrencia === r[0] ? 'ativo' : '') + '">' + r[1] + '</button>';

      if (f.recorrencia === 'Fixo') {

          '<label class="campo"><span>Total de parcelas</span><div class="stepper"><button data-acao="fStep" data-k="total" data-n="-1">−</button><input id="fTot" inputmode="numeric" value="' + f.total + '"><button data-acao="fStep" data-k="total" data-n="1">+</button></div></label></div>';
        h += '<p class="muted" id="fParcInfo" style="font-size:14px;margin:-4px 0 14px">' + infoParcelas() + '</p>';
      }
      h += '<button class="toggle-linha" data-acao="fJaPago" style="width:100%;text-align:left"><span><b>' + (f.tipo === 'Receita' ? 'Já recebi' : 'Já paguei') + '</b><small>Marca ' + (f.recorrencia === 'Parcelado' ? 'a parcela atual' : 'este lançamento') + ' como concluído</small></span><span class="sw' + (f.jaPago ? ' on' : '') + '"></span></button>';
    } else if (f.grupo) {
      h += '<button class="toggle-linha" data-acao="fAplicar" style="width:100%;text-align:left"><span><b>Aplicar aos próximos</b><small>Atualiza também os ' + (f.recorrencia === 'Parcelado' ? 'próximas parcelas' : 'próximos meses') + ' pendentes</small></span><span class="sw' + (f.aplicarProximos ? ' on' : '') + '"></span></button>';
    }
    h += '<label class="campo"><span>Observação (opcional)</span><textarea id="fObs" maxlength="500">' + esc(f.obs) + '</textarea></label>';
    h += '<div class="acoes"><button class="btn pri" data-acao="salvar" id="fSalvar">' + ic('check') + (novo ? 'Salvar lançamento' : 'Salvar alterações') + '</button></div>';
    abrirSheet(h);
  }
  function infoParcelas() {
    var f = FORM, n = f.total - f.parcela + 1;
    if (!(f.total >= 2) || f.parcela > f.total) return 'Confira as parcelas.';
    var ini = f.vencimento.slice(0, 7), fim = somarMes(ini, n - 1);
    return 'Gera ' + n + ' parcela(s): ' + f.parcela + '/' + f.total + ' em ' + mesCurto(ini) + ' até ' + f.total + '/' + f.total + ' em <b>' + mesCurto(fim) + '</b>' + (f.cents ? ' · total ' + brl(n * f.cents / 100) : '');
  }
  function campoPessoa(f) {
    var P = pessoas(); if (P.indexOf(f.titular) < 0 && !f.novaPessoa) P.push(f.titular);
    return '<div class="campo"><span>De quem</span><div class="chips quem">' + P.map(function (p) { return '<button class="chip' + (!f.novaPessoa && f.titular === p ? ' ativo' : '') + '" data-acao="fPessoa" data-v="' + esc(p) + '">' + esc(p) + '</button>'; }).join('') +
      '<button class="chip' + (f.novaPessoa ? ' ativo' : '') + '" data-acao="fPessoaNova">+ Outro</button></div>' +
      (f.novaPessoa ? '<input id="fNovaPessoa" maxlength="40" placeholder="Nome da pessoa ou empresa" autocomplete="off" style="margin-top:8px">' : '') + '</div>';
  }
  function lerForm() {
    if (!FORM) return;
    var g = function (id) { var e = document.getElementById(id); return e ? e.value : null; };
    if (g('fDesc') !== null) FORM.descricao = g('fDesc');
    if (g('fVenc')) FORM.vencimento = g('fVenc');
    if (g('fCat') !== null) FORM.categoria = g('fCat');
    if (g('fObs') !== null) FORM.obs = g('fObs');
    if (g('fParc') !== null) FORM.parcela = Math.max(1, parseInt(g('fParc'), 10) || 1);
    if (g('fTot') !== null) FORM.total = Math.max(2, parseInt(g('fTot'), 10) || 2);
    if (FORM.novaPessoa && g('fNovaPessoa') !== null) FORM.nomeNovo = g('fNovaPessoa').replace(/\s+/g, ' ').trim();
  }
  function salvarForm() {
    lerForm();
    var f = FORM;
    if (!f.cents) return toast('Informe o valor', true);
    if (!f.descricao.trim()) return toast('Informe a descrição', true);
    if (!f.vencimento) return toast('Informe o vencimento', true);
    if (f.novaPessoa) {
      if (!f.nomeNovo) return toast('Digite o nome em “De quem”', true);
      var igual = pessoas().filter(function (p) { return p.toLowerCase() === f.nomeNovo.toLowerCase(); })[0];
      f.titular = igual || f.nomeNovo; // evita duplicar "pai" e "Pai"
    }
    if (f.modo === 'novo' && f.recorrencia === 'Parcelado' && f.parcela > f.total) return toast('Parcela atual maior que o total', true);
    var btn = $('#fSalvar'); btn.disabled = true; btn.innerHTML = 'Salvando…';
    var dados = { descricao: f.descricao.trim(), valor: f.cents / 100, categoria: f.categoria, vencimento: f.vencimento, obs: f.obs };
    var acao;
    if (f.modo === 'novo') {
      acao = 'criar';
      dados.tipo = f.tipo; dados.recorrencia = f.recorrencia; dados.repetir = f.repetir; dados.jaPago = f.jaPago;
      dados.parcela = f.parcela; dados.totalParcelas = f.total; dados.titular = f.titular;
    } else { acao = 'editar'; dados.id = f.id; dados.aplicarProximos = f.aplicarProximos; dados.titular = f.titular; }
    var novoMes = f.vencimento.slice(0, 7);
    mutar(acao, dados).then(function () {
      fecharSheet();
      if (S.view === 'mes' && S.mes !== novoMes) { S.mes = novoMes; render(); }
      toast(acao === 'criar' ? (f.recorrencia === 'Parcelado' ? (f.total - f.parcela + 1) + ' parcelas lançadas' : 'Lançamento salvo') : 'Alterações salvas');
    }, function () { if (btn) { btn.disabled = false; btn.innerHTML = ic('check') + 'Tentar de novo'; } });
  }

  /* ----- anexos ----- */
  function lerArquivo(file) {
    return new Promise(function (ok, falha) {
      var fr = new FileReader();
      fr.onload = function () { ok(String(fr.result).split(',')[1]); };
      fr.onerror = function () { falha(new Error('Não foi possível ler o arquivo')); };
      fr.readAsDataURL(file);
    });
  }
  function comprimir(file) {
    return new Promise(function (ok, falha) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var max = 1600, w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        ok(c.toDataURL('image/jpeg', 0.82).split(',')[1]);
      };
      img.onerror = function () { URL.revokeObjectURL(url); falha(new Error('img')); };
      img.src = url;
    });
  }
  function anexar(id, file) {
    if (!file) return;
    var pdf = file.type === 'application/pdf';
    if (!pdf && file.type.indexOf('image/') !== 0) return toast('Envie uma foto ou PDF', true);
    if (pdf && file.size > 15 * 1024 * 1024) return toast('PDF maior que 15 MB', true);
    toast('Enviando comprovante…');
    var prep = pdf ? lerArquivo(file).then(function (b) { return { mime: 'application/pdf', base64: b }; })
      : comprimir(file).then(function (b) { return { mime: 'image/jpeg', base64: b }; }, function () {
        return lerArquivo(file).then(function (b) { return { mime: file.type, base64: b }; });
      });
    prep.then(function (a) { a.id = id; return mutar('anexar', a); })
      .then(function () { toast('Comprovante salvo no Drive'); if (!$('#sheet').hidden) abrirDetalhe(id); })
      .catch(function (e) { if (e.message !== 'sessao' && e.message.indexOf('Formato') < 0) toast(esc(e.message), true); });
  }
  function verAnexo(id) {
    var l = acharL(id);
    abrirSheet('<h2><span>Comprovante</span><button class="icon-btn" data-acao="det" data-id="' + id + '">' + ic('x') + '</button></h2><div class="esqueleto" style="height:260px"></div>');
    api('verAnexo', { id: id }).then(function (a) {
      var corpo = a.base64 ? '<img class="anexo-img" alt="Comprovante" src="data:' + esc(a.mime) + ';base64,' + a.base64 + '">' : '<div class="vazio-box">' + ic('clip') + '<b>' + esc(a.nome) + '</b>Visualize no Google Drive.</div><br>';
      abrirSheet('<h2><span>Comprovante</span><button class="icon-btn" data-acao="det" data-id="' + id + '">' + ic('x') + '</button></h2>' + corpo +
        '<p class="muted" style="font-size:13px;word-break:break-all;margin-top:0">' + esc(a.nome) + '</p><div class="acoes">' +
        '<a class="btn pri" style="text-decoration:none" href="' + esc(a.url) + '" target="_blank" rel="noopener">Abrir no Google Drive</a>' +
        '<button class="btn perigo" data-acao="desvincular" data-id="' + id + '">Desvincular do lançamento</button>' +
        '<button class="btn sec" data-acao="det" data-id="' + id + '">Voltar</button></div>');
    }, function (e) { if (e.message !== 'sessao') { toast(esc(e.message), true); abrirDetalhe(id); } });
  }

  /* ----- toast ----- */
  function toast(msg, erro, desfazer) {
    var t = document.createElement('div');
    t.className = 'toast-msg' + (erro ? ' erro' : '');
    t.innerHTML = msg + (desfazer ? ' <button style="color:inherit;text-decoration:underline;margin-left:8px;font-weight:700;pointer-events:auto">Desfazer</button>' : '');
    if (desfazer) t.querySelector('button').onclick = function () { t.remove(); desfazer(); };
    $('#toast').appendChild(t);
    setTimeout(function () { t.remove(); }, desfazer ? 4500 : 2600);
  }

  /* ================= TAREFAS (Kanban) ================= */
  var COLS = [
    { id: 'A fazer', ic: 'list', curto: 'A fazer' }, { id: 'Fazendo', ic: 'play', curto: 'Fazendo' },
    { id: 'Aguardando', ic: 'pause', curto: 'Aguardando' }, { id: 'Concluído', ic: 'done', curto: 'Concluído' }
  ];
  function ehDesktop() { return window.matchMedia('(min-width: 900px)').matches; }
  function corTag(t) { var h = 0; for (var i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) % 360; return h; }
  function tagHtml(t, extra) { return '<span class="ttag" style="--h:' + corTag(t.toLowerCase()) + '"' + (extra || '') + '>' + esc(t) + '</span>'; }
  function progresso(t) {
    var tot = 0, ok = 0;
    t.checklist.forEach(function (g) { g.itens.forEach(function (i) { tot++; if (i.ok) ok++; }); });
    return { tot: tot, ok: ok };
  }
  function acharT(id) { return S.t.tarefas.find(function (t) { return t.id === id; }); }
  function todasTags() {
    var c = {};
    S.t.tarefas.forEach(function (t) { t.tags.forEach(function (g) { c[g] = (c[g] || 0) + 1; }); });
    return Object.keys(c).sort(function (a, b) { return c[b] - c[a] || a.localeCompare(b); });
  }
  function tarefasDa(col) {
    return S.t.tarefas.filter(function (t) { return t.status === col && (!S.tagF || t.tags.indexOf(S.tagF) >= 0); })
      .sort(col === 'Concluído'
        ? function (a, b) { return (b.concluidoEm || '').localeCompare(a.concluidoEm || ''); }
        : function (a, b) { return a.ordem - b.ordem || (b.criadoEm || '').localeCompare(a.criadoEm || ''); });
  }
  function prazoTag(t) {
    if (!t.prazo) return '';
    if (t.status === 'Concluído') return '<span class="tag">' + ic('flag') + dataBR(t.prazo) + '</span>';
    var d = diasEntre(S.t.hoje, t.prazo);
    if (d < 0) return '<span class="tag atraso">' + ic('flag') + 'Atrasada ' + (-d) + 'd</span>';
    if (d === 0) return '<span class="tag hoje">' + ic('flag') + 'Hoje</span>';
    if (d <= 3) return '<span class="tag hoje">' + ic('flag') + 'Em ' + d + 'd</span>';
    return '<span class="tag">' + ic('flag') + dataBR(t.prazo) + '</span>';
  }

  function cardTar(t) {
    var p = progresso(t), i = STATUS_IDX(t.status);
    return '<div class="tcard" draggable="true" data-tid="' + t.id + '">' +
      '<button class="tcorpo" data-acao="tDet" data-id="' + t.id + '">' +
      (t.tags.length ? '<div class="ttags">' + t.tags.map(function (g) { return tagHtml(g); }).join('') + '</div>' : '') +
      '<div class="ttit">' + esc(t.titulo) + '</div>' +
      (t.descricao ? '<div class="tdesc">' + esc(t.descricao.split('\n')[0]) + '</div>' : '') +
      (p.tot ? '<div class="tprog"><span class="t"><i style="width:' + (p.ok / p.tot * 100) + '%"></i></span><span class="num">' + p.ok + '/' + p.tot + '</span></div>' : '') +
      (t.prazo ? '<div class="meta">' + prazoTag(t) + '</div>' : '') + '</button>' +
      (i < 3 ? '<button class="tavanca" data-acao="tAvancar" data-id="' + t.id + '" title="Mover para ' + COLS[i + 1].id + '">' + ic('right') + '</button>' : '') +
      '</div>';
  }
  function STATUS_IDX(s) { for (var i = 0; i < COLS.length; i++) if (COLS[i].id === s) return i; return 0; }

  function renderTar() {
    var cont = {};
    COLS.forEach(function (c) { cont[c.id] = tarefasDa(c.id).length; });
    // celular: as 4 colunas viram a barra inferior
    $('#bottomNav').style.gridTemplateColumns = 'repeat(4, 1fr)';
    $('#bottomNav').innerHTML = COLS.map(function (c) {
      return '<button class="' + (S.col === c.id ? 'ativo' : '') + '" data-acao="tCol" data-id="' + c.id + '">' + ic(c.ic) + '<span>' + c.curto + '</span>' +
        (cont[c.id] ? '<span class="badge neutro">' + cont[c.id] + '</span>' : '') + '</button>';
    }).join('');
    $('#subnav').hidden = true;

    var tags = todasTags();
    var h = '';
    if (tags.length) {
      h += '<div class="chips" style="margin-top:4px"><button class="chip' + (!S.tagF ? ' ativo' : '') + '" data-acao="tTag" data-id="">Todas</button>' +
        tags.map(function (g) { return '<button class="chip' + (S.tagF === g ? ' ativo' : '') + '" data-acao="tTag" data-id="' + esc(g) + '">' + esc(g) + '</button>'; }).join('') + '</div>';
    }
    if (!S.t.tarefas.length) {
      $('#view').innerHTML = h + vazio('kanban', 'Nenhuma tarefa ainda', 'Toque no <b style="display:inline">+</b> para criar a primeira.');
      return;
    }
    h += '<div class="board">' + COLS.map(function (c) {
      var L = tarefasDa(c.id);

        '<div class="ccab">' + ic(c.ic) + '<span>' + c.id + '</span><span class="num muted">' + L.length + '</span></div>' +
        '<div class="ccards">' + (L.length ? L.map(cardTar).join('') : '<div class="cvazia">' + (c.id === 'Concluído' ? 'Nada concluído ainda' : 'Arraste ou crie uma tarefa aqui') + '</div>') + '</div></section>';
    }).join('') + '</div>';
    $('#view').innerHTML = h;
  }

  function moverTarefa(id, status, ordem) {
    var t = acharT(id); if (!t) return;
    var antes = { status: t.status, ordem: t.ordem, concluidoEm: t.concluidoEm };
    if (antes.status === status && ordem === undefined) return;
    if (navigator.vibrate) navigator.vibrate(12);
    mutar('tarefaMover', { id: id, status: status, ordem: ordem }, function () {
      t.status = status; if (ordem !== undefined) t.ordem = ordem;
      if (status !== antes.status) t.concluidoEm = status === 'Concluído' ? new Date().toISOString().slice(0, 19).replace('T', ' ') : '';
      return function () { t.status = antes.status; t.ordem = antes.ordem; t.concluidoEm = antes.concluidoEm; };
    }).then(function () {}, function () {});
    if (status !== antes.status) toast(esc(t.titulo.length > 28 ? t.titulo.slice(0, 28) + '…' : t.titulo) + ' → ' + status, false, function () { moverTarefa(id, antes.status, antes.ordem); });
  }

  /* ----- detalhe da tarefa (checklist editável) ----- */

    h += '<div class="seg st4">' + COLS.map(function (c) { return '<button data-acao="tStatus" data-id="' + t.id + '" data-v="' + c.id + '" class="' + (t.status === c.id ? 'ativo' : '') + '">' + c.curto + '</button>'; }).join('') + '</div>';
    if (t.descricao) h += '<p style="margin:0 0 16px;white-space:pre-wrap;line-height:1.5">' + esc(t.descricao) + '</p>';

    h += '<div class="secao" style="margin-top:4px"><span>Checklist</span><span class="num">' + (p.tot ? p.ok + '/' + p.tot : '') + '</span></div>';
    if (p.tot) h += '<div class="barra" style="margin:0 0 12px"><i style="width:' + (p.ok / p.tot * 100) + '%"></i></div>';
    t.checklist.forEach(function (g, gi) {
      var ok = g.itens.filter(function (x) { return x.ok; }).length;
      h += '<div class="chk-grupo">' + (g.nome || t.checklist.length > 1 ? '<div class="chk-nome"><b>' + esc(g.nome || 'Lista ' + (gi + 1)) + '</b><span class="muted num">' + ok + '/' + g.itens.length + '</span><button class="icon-btn mini" data-acao="tGrupoDel" data-id="' + t.id + '" data-g="' + gi + '" title="Remover lista">' + ic('trash') + '</button></div>' : '');
      g.itens.forEach(function (it, ii) {
        h += '<div class="chk-item' + (it.ok ? ' ok' : '') + '"><button class="chk-box" data-acao="tChk" data-id="' + t.id + '" data-g="' + gi + '" data-i="' + ii + '"><span class="cx">' + ic('check') + '</span><span class="ct">' + esc(it.t) + '</span></button>' +
          '<button class="icon-btn mini" data-acao="tChkDel" data-id="' + t.id + '" data-g="' + gi + '" data-i="' + ii + '" title="Remover">' + ic('x') + '</button></div>';
      });
      h += '<div class="chk-add"><input data-addg="' + gi + '" data-id="' + t.id + '" placeholder="Adicionar item…" maxlength="300" enterkeyhint="done"><button class="icon-btn" data-acao="tChkAdd" data-id="' + t.id + '" data-g="' + gi + '">' + ic('plus') + '</button></div></div>';
    });
    h += '<div class="chk-add nova"><input id="novaLista" placeholder="' + (t.checklist.length ? 'Nova lista (ex.: Compras)…' : 'Criar checklist (nome opcional)…') + '" maxlength="80" enterkeyhint="done"><button class="icon-btn" data-acao="tGrupoAdd" data-id="' + t.id + '">' + ic('plus') + '</button></div>';

    h += '<div class="acoes" style="margin-top:16px">';

  var EMO_META = ['🎯', '🛡️', '🏖️', '✈️', '🚗', '🏍️', '🏠', '🎓', '💍', '👶', '📱', '💻', '🩺', '🐶', '🎸', '💰'];
  function saldoMeta(id) { return S.m.movs.filter(function (v) { return v.metaId === id; }).reduce(function (s, v) { return s + (v.tipo === 'Aporte' ? v.valor : -v.valor); }, 0); }
  function mesesEntre(a, b) { return (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7)); }
  /** Quanto guardar por mês até o prazo, e se o ritmo está atrás do esperado (progresso linear desde a criação). */
  function ritmoMeta(x) {
    var saldo = saldoMeta(x.id), falta = Math.max(0, x.alvo - saldo), r = { falta: falta, saldo: saldo, pct: x.alvo ? Math.min(100, saldo / x.alvo * 100) : 0 };
    if (!x.prazo || x.status === 'Concluída' || falta <= 0) return r;
    var hoje = S.m.hoje;
    r.vencida = x.prazo < hoje;
    r.porMes = r.vencida ? falta : falta / Math.max(1, mesesEntre(hoje, x.prazo) || 1);
    var ini = (x.criadoEm || hoje).slice(0, 10), tot = Math.max(1, diasEntre(ini, x.prazo)), dec = Math.max(0, diasEntre(ini, hoje));
    var esperado = Math.min(1, dec / tot) * x.alvo;
    r.atrasada = x.status === 'Ativa' && (r.vencida || saldo + 0.01 < esperado * 0.9);
    return r;
  }
  function metasDa() { return S.m.metas.filter(function (x) { return S.metPes === '*' || x.titular === S.metPes; }); }
  function pessoasMeta() {

  function renderMet() {

  function movLinha(v, comMeta) {

  /* ----- formulários ----- */
  var FM = null, FV = null;

    h += '<div class="campo"><span>De quem</span><div class="chips quem">' + P.map(function (p) { return '<button class="chip' + (f.titular === p ? ' ativo' : '') + '" data-acao="fmTitular" data-v="' + esc(p) + '">' + esc(p) + '</button>'; }).join('') + '</div>' +

    h += '<label class="campo"><span>Observação (opcional)</span><textarea id="fmObs" maxlength="1000" rows="2">' + esc(f.obs) + '</textarea></label>';

  function salvarFM() {

      .then(function () { var nova = f.nova; FM = null; fecharSheet(); toast(nova ? 'Meta criada 🎯' : 'Meta atualizada'); }, function () { b.disabled = false; b.innerHTML = ic('check') + 'Tentar de novo'; });

  function formMov(metaId, tipo) {
    var x = S.m.metas.find(function (o) { return o.id === metaId; });

  function lerFV() { var d = $('#mvData'), o = $('#mvObs'); if (FV && d) { FV.data = d.value; FV.obs = o.value; } }
  function salvarFV() {

  // A movimentação pode ter criado/apagado lançamento: recarrega o Financeiro em segundo plano.
  function atualizarFinanceiroDepois() { api('carregar').then(function (d) { S.d = d; if (S.modulo === 'fin' || S.modulo === 'home') render(); }, function () {}); }

  /* ================= DOCUMENTOS ================= */
  var DVIEWS = [{ id: 'docs', nome: 'Documentos', ic: 'idcard' }, { id: 'ir', nome: 'Imposto de Renda', ic: 'receipt' }];
  var EMO_DOC = { 'CPF': '🧾', 'RG': '🪪', 'CNH': '🚗', 'Passaporte': '🛂', 'Título de eleitor': '🗳️', 'CTPS': '📕', 'Certidão': '📜', 'Reservista': '🎖️', 'Outro': '📄' };
  var COR_IR = { 'Pendente': 'atraso', 'Em andamento': 'hoje', 'Entregue': 'okv', 'Retificada': 'okv', 'Malha fina': 'atraso' };
  function mascarar(n) {
    var tot = (n.match(/[0-9a-z]/gi) || []).length, vistos = 0;
    return n.replace(/[0-9a-z]/gi, function (c) { vistos++; return vistos > tot - 4 ? c : '•'; });
  }
  function diasDoc(d) { return d.validade ? diasEntre(S.x.hoje, d.validade) : null; }
  function statusDoc(d) {

    if (n < 0) return '<span class="tag atraso">Vencido há ' + (-n) + 'd</span>';

  }
  function urgentes() { return S.x.docs.filter(function (d) { var n = diasDoc(d); return n !== null && n <= 30; }).length; }

  function copiar(txt, rotulo) {

  function copiarVelho(txt) { var t = document.createElement('textarea'); t.value = txt; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) {} t.remove(); }
  function botaoLink(url, rotulo) { return url ? '<a class="btn sec" style="text-decoration:none" href="' + esc(url) + '" target="_blank" rel="noopener">' + ic('ext') + esc(rotulo) + '</a>' : ''; }

  function renderDoc() {

  function vDocs() {

        break;
      // pessoas (financeiro)
      case 'pessoa': S.pessoa = id; render(); window.scrollTo(0, 0); break;
      case 'pessoasGerir': gerirPessoas(); break;
      case 'pessoaRenomear': renomearPessoa(id); break;
      case 'pessoaRenomearOk':
        var novoNome = ($('#pNovo').value || '').replace(/\s+/g, ' ').trim();
        if (!novoNome) { toast('Digite o novo nome', true); break; }
        if (novoNome === id) { gerirPessoas(); break; }
        var existente = pessoas().filter(function (p) { return p.toLowerCase() === novoNome.toLowerCase() && p !== id; })[0];
        el.disabled = true; el.textContent = 'Renomeando…';
        mutar('renomearPessoa', { de: id, para: existente || novoNome }).then(function () {
          if (S.pessoa === id) S.pessoa = existente || novoNome;
          toast('Renomeado para ' + esc(existente || novoNome)); gerirPessoas(); render();
        }, function () { el.disabled = false; el.textContent = 'Tentar de novo'; });
        break;
      case 'fPessoa': lerForm(); FORM.titular = el.getAttribute('data-v'); FORM.novaPessoa = false; renderForm(); break;
      case 'fPessoaNova': lerForm(); FORM.novaPessoa = true; renderForm(); setTimeout(function () { var e = $('#fNovaPessoa'); if (e) e.focus(); }, 50); break;
      // tarefas
      case 'tCol': S.col = id; store('cm_col', id); render(); window.scrollTo(0, 0); break;
      case 'tTag': S.tagF = id; render(); break;
      case 'tDet': abrirTarefa(id); break;
      case 'tAvancar': ev.stopPropagation(); var ta = acharT(id); moverTarefa(id, COLS[Math.min(3, STATUS_IDX(ta.status) + 1)].id); break;
      case 'tStatus': moverTarefa(id, el.getAttribute('data-v')); abrirTarefa(id, true); break;
      case 'tChk':
        var tc = acharT(id), g = +el.getAttribute('data-g'), ii = +el.getAttribute('data-i');
        if (navigator.vibrate) navigator.vibrate(10);
        salvarChecklist(tc, function (c) { c[g].itens[ii].ok = !c[g].itens[ii].ok; });
        break;
      case 'tChkDel':
        var td = acharT(id), g2 = +el.getAttribute('data-g'), i2 = +el.getAttribute('data-i');
        salvarChecklist(td, function (c) { c[g2].itens.splice(i2, 1); });
        break;
      case 'tChkAdd': addItem(id, +el.getAttribute('data-g')); break;
      case 'tGrupoAdd':
        var tg = acharT(id), nome = ($('#novaLista').value || '').trim();
        salvarChecklist(tg, function (c) { c.push({ nome: nome, itens: [] }); });
        setTimeout(function () { var x = document.querySelector('[data-addg="' + (tg.checklist.length - 1) + '"]'); if (x) x.focus(); }, 50);
        break;
      case 'tGrupoDel':
        var tgd = acharT(id), g3 = +el.getAttribute('data-g');
        if (tgd.checklist[g3].itens.length && !confirm('Remover a lista "' + (tgd.checklist[g3].nome || 'Lista') + '" e seus ' + tgd.checklist[g3].itens.length + ' itens?')) break;
        salvarChecklist(tgd, function (c) { c.splice(g3, 1); });
        break;
      case 'tEditar': formTarefa(id); break;
      case 'tExcluir': confirmarExcluirTarefa(id); break;
      case 'tExcluirOk':
        el.disabled = true; el.textContent = 'Excluindo…';
        mutar('tarefaExcluir', { id: id }).then(function () { fecharSheet(); toast('Tarefa excluída'); }, function () {});
        break;
      case 'ftStatus': lerFT(); FT.status = el.getAttribute('data-v'); renderFormTarefa(); break;
      case 'ftTagAdd': lerFT(); addTagFT(el.getAttribute('data-v')); renderFormTarefa(); break;
      case 'ftTagDel': lerFT(); FT.tags.splice(+el.getAttribute('data-i'), 1); renderFormTarefa(); break;
      case 'ftSalvar': salvarFT(); break;
      // documentos
      case 'dView': S.dview = id; store('cm_dview', id); render(); window.scrollTo(0, 0); break;
      case 'dTit': S.titF = id; render(); break;
      case 'dDet': abrirDoc(id); break;
      case 'dRevelar': S.revelar[id] = !S.revelar[id]; abrirDoc(id); break;
      case 'dCopiar': copiar(S.x.docs.find(function (o) { return o.id === id; }).numero, 'Número copiado'); break;
      case 'dEditar': formDoc(id); break;
      case 'dExcluir': var dx = S.x.docs.find(function (o) { return o.id === id; }); confirmarExcluirX('docExcluir', id, dx.tipo + ' · ' + dx.titular); break;
      case 'iDet': abrirIr(id); break;
      case 'iCopiar': copiar(S.x.ir.find(function (o) { return o.id === id; }).recibo, 'Recibo copiado'); break;
      case 'iEditar': formIr(id); break;
      case 'iExcluir': var ix = S.x.ir.find(function (o) { return o.id === id; }); confirmarExcluirX('irExcluir', id, 'IR ' + ix.exercicio + ' · ' + ix.declarante); break;
      case 'xExcluirOk':
        el.disabled = true; el.textContent = 'Excluindo…';
        mutar(el.getAttribute('data-v'), { id: id }).then(function () { fecharSheet(); toast('Excluído'); }, function () {});
        break;
      case 'fdTipo': lerFD(); FD.tipo = el.getAttribute('data-v'); if (!FD.id && !FD.validade) FD.semValidade = FD.tipo === 'CPF' || FD.tipo === 'Certidão'; renderFormDoc(); break;
      case 'fdSemVal': lerFD(); FD.semValidade = !FD.semValidade; renderFormDoc(); break;
      case 'fdSalvar': salvarFD(); break;
      case 'fiAno': lerFI(); FI.exercicio = Math.min(2100, Math.max(2000, FI.exercicio + (+el.getAttribute('data-n')))); renderFormIr(); break;
      case 'fiStatus': lerFI(); FI.status = el.getAttribute('data-v'); renderFormIr(); break;
      case 'fiRes': lerFI(); FI.resultado = el.getAttribute('data-v'); renderFormIr(); break;
      case 'fiSalvar': salvarFI(); break;
      // hábitos
      case 'hView': S.hview = id; store('cm_hview', id); render(); window.scrollTo(0, 0); break;
      case 'hDia': S.hdia = id; render(); break;
      case 'hCheck': checkHabito(id); break;
      case 'hEditar': formHabito(id); break;
      case 'hAtivo':
        var ha = S.h.habitos.find(function (x) { return x.id === id; }), lig2 = !ha.ativo;
        mutar('habitoAtivo', { id: id, ativo: lig2 }, function () { ha.ativo = lig2; return function () { ha.ativo = !lig2; }; })
          .then(function () { toast(lig2 ? 'Hábito ativado' : 'Hábito pausado'); }, function () {});
        break;
      case 'fhIcone': lerFH(); FH.icone = el.getAttribute('data-v'); renderFormHabito(); break;
      case 'fhDia':
        lerFH(); var dv = el.getAttribute('data-v');
        FH.dias = (FH.dias.indexOf(dv) >= 0 ? FH.dias.replace(dv, '') : FH.dias + dv).split('').sort().join('');
        renderFormHabito(); break;
      case 'fhPreset': lerFH(); FH.dias = el.getAttribute('data-v'); renderFormHabito(); break;
      case 'fhSalvar': salvarFH(); break;
      case 'fhExcluir':
        var hx = S.h.habitos.find(function (x) { return x.id === id; });
        var nchk = S.h.checkins.filter(function (c) { return c[1] === id; }).length;
        abrirSheet('<h2><span>Excluir hábito?</span></h2><p class="muted" style="margin-top:-6px">' + esc(hx.icone + ' ' + hx.nome) + (nchk ? ' · ' + nchk + ' check-in(s) também serão apagados.' : '') + '</p>' +
          '<p class="muted" style="font-size:14px">Se quiser só parar por um tempo, use <b>pausar</b> — o histórico fica guardado.</p><div class="acoes">' +
          '<button class="btn perigo" data-acao="hExcluirOk" data-id="' + id + '">' + ic('trash') + 'Excluir de vez</button>' +
          '<button class="btn sec" data-acao="hEditar" data-id="' + id + '">Cancelar</button></div>');
        break;
      case 'hExcluirOk':
        el.disabled = true; el.textContent = 'Excluindo…';
        mutar('habitoExcluir', { id: id }).then(function () { fecharSheet(); toast('Hábito excluído'); }, function () {});
        break;
      // formulário
      case 'fTipo': lerForm(); FORM.tipo = el.getAttribute('data-v'); FORM.categoria = ''; renderForm(); break;
      case 'fRec': lerForm(); FORM.recorrencia = el.getAttribute('data-v'); renderForm(); break;
      case 'fRepetir': lerForm(); FORM.repetir = !FORM.repetir; renderForm(); break;
      case 'fJaPago': lerForm(); FORM.jaPago = !FORM.jaPago; renderForm(); break;
      case 'fAplicar': lerForm(); FORM.aplicarProximos = !FORM.aplicarProximos; renderForm(); break;
      case 'fStep':
        lerForm(); var k = el.getAttribute('data-k');
        FORM[k] = Math.min(120, Math.max(k === 'total' ? 2 : 1, FORM[k] + (+el.getAttribute('data-n'))));
        $('#fParc').value = FORM.parcela; $('#fTot').value = FORM.total; $('#fParcInfo').innerHTML = infoParcelas();
        break;
      case 'salvar': salvarForm(); break;
    }
  });
  function fecharSheetSeModulos() { if (!$('#sheet').hidden && $('#sheetBody h2 span') && $('#sheetBody h2 span').textContent === 'Painéis') fecharSheet(); }

  $('#fab').addEventListener('click', function () {
    if (S.modulo === 'tar') { if (S.t) formTarefa(); }
    else if (S.modulo === 'hab') { if (S.h) formHabito(); }
    else if (S.modulo === 'doc') { if (S.x) { if (S.dview === 'ir') formIr(); else formDoc(); } }
    else if (S.modulo === 'met') { if (S.m) formMeta(); }
    else if (S.d) novoForm();
  });

  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'fValor') {
      var dig = t.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 11);
      FORM.cents = +dig || 0;
      t.value = FORM.cents ? NUM.format(FORM.cents / 100) : '';
      if ($('#fParcInfo')) $('#fParcInfo').innerHTML = infoParcelas();
    } else if (t.id === 'fmAlvo' || t.id === 'mvValor') {
      var dm = t.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 11), alvoObj = t.id === 'fmAlvo' ? FM : FV;
      alvoObj.cents = +dm || 0;
      t.value = alvoObj.cents ? NUM.format(alvoObj.cents / 100) : '';
    } else if (t.id === 'fiValor') {
      var dg = t.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 11);
      FI.cents = +dg || 0;
      t.value = FI.cents ? NUM.format(FI.cents / 100) : '';
    } else if (t.id === 'fParc' || t.id === 'fTot' || t.id === 'fVenc') {
      lerForm(); if ($('#fParcInfo')) $('#fParcInfo').innerHTML = infoParcelas();
    }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.hasAttribute && t.hasAttribute('data-anexar')) { anexar(t.getAttribute('data-anexar'), t.files[0]); t.value = ''; }
    if (t.id === 'cardFoto') { fotoCard(t.files[0]); t.value = ''; }
  });
  document.addEventListener('keydown', function (ev) {
    if (!$('#pin').hidden) {
      if (/^\d$/.test(ev.key)) teclaPin(ev.key);
      else if (ev.key === 'Backspace') teclaPin('del');
      return;
    }
    if (ev.key === 'Escape' && !$('#sheet').hidden) fecharSheet();
    if (ev.key === 'Enter' && ev.target.tagName === 'INPUT') {
      var t = ev.target;
      if (t.hasAttribute('data-addg')) { ev.preventDefault(); addItem(t.getAttribute('data-id'), +t.getAttribute('data-addg')); }
      else if (t.id === 'novaLista') { ev.preventDefault(); var b = document.querySelector('[data-acao="tGrupoAdd"]'); if (b) b.click(); }
      else if (t.id === 'ftTag') { ev.preventDefault(); lerFT(); renderFormTarefa(); setTimeout(function () { var x = $('#ftTag'); if (x) x.focus(); }, 30); }
      else if (t.id === 'ftTit') { ev.preventDefault(); salvarFT(); }
      else if (t.id === 'fhNome') { ev.preventDefault(); salvarFH(); }
      else if (t.id === 'fmNome') { ev.preventDefault(); salvarFM(); }
    }
  });

  // Deslizar para trocar de mês (Mês e Análise).
  var tx = null, ty = null;
  $('#view').addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  $('#view').addEventListener('touchend', function (e) {
    if (tx === null || S.modulo !== 'fin' || (S.view !== 'mes' && S.view !== 'anal') || e.target.closest('.chips')) return;
    var dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) { S.mes = somarMes(S.mes, dx < 0 ? 1 : -1); render(); }
    tx = null;
  }, { passive: true });

  // Recarrega dados ao voltar para o app (ex.: depois de horas em segundo plano).
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && S.token && S.d && S.pend === 0 && $('#sheet').hidden) {
      var cm = CARGA_MOD[S.modulo];
      api(cm[0]).then(function (d) { if (S.pend === 0) { S[cm[1]] = d; render(); } }, function () {});
    }
  });

  /* ================= boot ================= */
  montarTeclado();
  if (!NO_GAS) {
    // Link de instalação: .../#api=<ID da implantação>. Guarda no aparelho e limpa da barra.
    var m = /[#&]api=([\w-]{20,})/.exec(location.hash);
    if (m) { store('cm_api', m[1]); history.replaceState(null, '', location.pathname + location.search); }
    if (!store('cm_api')) {
      $('#pin').hidden = false; pinBloqueado = true;
      $('#pinMsg').textContent = 'App não configurado neste aparelho. Abra o link de instalação.';
      return;
    }
  }
  if (S.token) iniciar(); else { $('#pin').hidden = false; }
})();
</script>

<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
